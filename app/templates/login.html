{% extends "base.html" %}
{% block main %}
<div class="narrow">
  <h1 class="large">Welcome back</h1>
  <p class="sub">Sign in to manage your tunes.</p>
  <form method="post" class="card">
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required autofocus
             {% if wrong %}aria-invalid="true" aria-describedby="wrong"{% endif %}>
      {% if wrong %}<small id="wrong" class="error">That password didn't work. Try again.</small>{% endif %}
    </div>
    <button type="submit" class="btn press wide">Sign in</button>
  </form>
</div>
{% endblock %}
