{% extends "base.html" %}
{% block main %}
<article>
  <hgroup><h1>Add a tune</h1><p>Sheet music from StaffPad and a recording of the tune.</p></hgroup>
  <form method="post" enctype="multipart/form-data" data-upload>
    <label>Title <input name="title" required autocomplete="off" placeholder="e.g. A Pint for Ciaran"></label>
    <label>Sheet music (MusicXML) <input type="file" name="sheet" required></label>
    <label>Recording <input type="file" name="recording" accept="audio/*,video/*" required></label>
    <button type="submit">Save tune</button>
    <progress hidden></progress>
    <p class="progress" hidden></p>
  </form>
</article>
{% endblock %}
