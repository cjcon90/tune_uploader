<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tunes">
  <title>{% block title %}Pauline's Tunes{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="preload" href="{{ url_for('static', filename='fonts/fraunces.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ url_for('static', filename='fonts/source-sans-3.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="bar">
    {% if session.signed_in and request.endpoint != "main.tunes" %}
    <a href="{{ url_for('main.tunes') }}" class="back press">‹ My Tunes</a>
    {% else %}
    <a href="{{ url_for('main.tunes') }}" class="brand">
      <span class="mark">{% include "note.svg" %}</span>Pauline's Tunes
    </a>
    {% endif %}
    {% if session.signed_in and request.endpoint != "main.add" %}
    <a href="{{ url_for('main.add') }}" class="btn press">+ Add a tune</a>
    {% endif %}
  </header>
  {% if done %}<p class="toast" role="status"><b>✓</b> {{ done }}</p>{% endif %}
  <main>
    {% block main %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
